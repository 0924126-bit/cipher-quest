<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Identity E - 文化祭ロール専用アプリ">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Identity E">
  <meta name="theme-color" content="#26323E">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Identity E</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Kill long-press artifacts on touch devices:
       - text selection / translate popup
       - iOS callout menu
       - tap highlight flash
       - image drag ghost */
    html, body {
      -webkit-user-select: none;
      -moz-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      overscroll-behavior: none;
      background: #060608;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    /* ---- fullscreen offset fix (iPhone / Android PWA) ----
       Pin the page to the visual viewport so the app never renders
       shifted when the URL bar / status bar collapses or when the
       PWA launches in fullscreen display mode. dvh tracks the
       dynamic viewport; position:fixed prevents rubber-band offset. */
    html {
      height: 100%;
      height: 100dvh;
    }
    body {
      position: fixed;
      inset: 0;
      width: 100%;
      width: 100dvw;
      height: 100%;
      height: 100dvh;
    }
    img { -webkit-user-drag: none; user-drag: none; }

    /* ---------- boot loading screen ---------- */
    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 40%, #2b3844 0%, #141b21 70%);
      z-index: 9999;
      transition: opacity .45s ease;
      font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    #boot.hide { opacity: 0; pointer-events: none; }
    #boot .logo {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      margin-bottom: 22px;
      box-shadow: 0 8px 32px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.08);
      animation: breathe 2.6s ease-in-out infinite;
    }
    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }
    #boot .title {
      color: #cfd8e0;
      font-size: 24px;
      letter-spacing: 8px;
      margin-bottom: 6px;
      text-shadow: 0 0 24px rgba(160,190,215,.35);
    }
    #boot .sub {
      color: #7a8794;
      font-size: 12px;
      letter-spacing: 4px;
      margin-bottom: 36px;
    }
    #boot .barwrap {
      width: min(240px, 60vw);
      height: 3px;
      background: #35414c;
      border-radius: 2px;
      overflow: hidden;
    }
    #boot .bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #51677c, #a9c4dc);
      border-radius: 2px;
      transition: width .3s ease;
    }
    #boot .pct {
      color: #7a8794;
      font-size: 11px;
      letter-spacing: 2px;
      margin-top: 14px;
    }
  </style>
</head>
<body>
  <!-- boot loading screen: shown instantly, removed when Flutter first frame renders -->
  <div id="boot">
    <img class="logo" src="icons/Icon-192.png" alt="Identity E">
    <div class="title">IDENTITY E</div>
    <div class="sub">読み込んでいます…</div>
    <div class="barwrap"><div class="bar" id="bootbar"></div></div>
    <div class="pct" id="bootpct">0%</div>
  </div>

  <script>
    // Block browser context menu (right-click / touch long-press "translate, copy..." popup)
    window.addEventListener('contextmenu', function (e) { e.preventDefault(); }, { capture: true });
    // Block text-selection start (belt & suspenders for Android Chrome long-press)
    window.addEventListener('selectstart', function (e) { e.preventDefault(); }, { capture: true });
    // Block double-tap zoom / pinch gestures interfering with hold-to-decode
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
    document.addEventListener('dblclick', function (e) { e.preventDefault(); }, { capture: true });

    // ---- fullscreen offset fix: keep scroll pinned at 0 and let Flutter
    // recompute its metrics whenever the visual viewport changes
    // (fullscreen enter/exit, rotation, iOS URL-bar collapse). ----
    (function () {
      function repin() {
        window.scrollTo(0, 0);
        document.documentElement.scrollTop = 0;
        document.body.scrollTop = 0;
        window.dispatchEvent(new Event('resize'));
      }
      window.addEventListener('orientationchange', function () { setTimeout(repin, 250); });
      document.addEventListener('fullscreenchange', function () { setTimeout(repin, 60); });
      document.addEventListener('webkitfullscreenchange', function () { setTimeout(repin, 60); });
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', function () { window.scrollTo(0, 0); });
      }
      window.addEventListener('scroll', function () {
        if (window.scrollY !== 0) window.scrollTo(0, 0);
      }, { passive: true });
    })();

    // ---- back-swipe / back-navigation blocker (role pages only) ----
    // iPhone/Android edge-swipe-back must not leave the role screen.
    // 1) touchstart near screen edges is cancelled before the browser
    //    can start its swipe-back gesture (iOS Safari standalone/PWA).
    // 2) history is pinned: every popstate immediately pushes forward
    //    again, so hardware/gesture back never exits the role page.
    (function () {
      function onRolePage() {
        var h = window.location.hash || '';
        return /^#\/(role|chaser|cursed|hunter)/.test(h);
      }
      // 1) edge-swipe suppression
      document.addEventListener('touchstart', function (e) {
        if (!onRolePage()) return;
        var t = e.touches && e.touches[0];
        if (!t) return;
        var edge = 28; // px from either horizontal edge
        if (t.clientX <= edge || t.clientX >= window.innerWidth - edge) {
          e.preventDefault();
        }
      }, { passive: false, capture: true });
      // 2) history pinning
      function pin() {
        try { history.pushState({ roleLock: 1 }, '', window.location.href); } catch (_) {}
      }
      window.addEventListener('hashchange', function () {
        if (onRolePage()) pin();
      });
      window.addEventListener('popstate', function () {
        if (onRolePage()) pin();
      });
      if (onRolePage()) pin();
    })();

    // ---- auto-update check (lightweight) ----
    // The deploy step writes build_id.js (window.__IE_BUILD_ID, cached with
    // this build) and build_id.json (~25 bytes, always fetched no-store).
    // If the ids differ the client is stale -> hard refresh with an
    // "アップデート中…" screen. Checks: 4s after launch and when the app
    // returns to foreground (throttled to once per 5 minutes).
    // NO periodic polling — keeps requests inside the free tier.
    (function () {
      var REFRESH_GUARD_KEY = 'ie_upd_last_refresh';
      var lastCheckMs = 0;
      function check() {
        if (!window.__IE_BUILD_ID) return; // dev or missing -> skip
        lastCheckMs = Date.now();
        fetch('build_id.json?t=' + Date.now(), { cache: 'no-store' })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (d) {
            if (!d || !d.id) return;
            if (d.id === window.__IE_BUILD_ID) return;
            // reload-loop guard: at most once per minute
            try {
              var last = parseInt(localStorage.getItem(REFRESH_GUARD_KEY) || '0', 10);
              if (Date.now() - last < 60000) return;
              localStorage.setItem(REFRESH_GUARD_KEY, String(Date.now()));
            } catch (_) {}
            window.__hardRefresh();
          })
          .catch(function () {});
      }
      setTimeout(check, 4000);
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState !== 'visible') return;
        // throttle: skip if we checked within the last 5 minutes
        if (Date.now() - lastCheckMs < 5 * 60 * 1000) return;
        setTimeout(check, 1200);
      });
    })();

    // ---- hard refresh for auto-update ----
    // Shows a Google-minimal "アップデート中…" overlay, unregisters
    // service workers, clears CacheStorage, then reloads. Called from
    // Dart (UpdateService) when the server build id differs.
    window.__hardRefresh = async function () {
      try {
        var d = document.createElement('div');
        d.style.cssText = 'position:fixed;inset:0;background:#fff;z-index:2147483647;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Roboto,"Noto Sans JP",system-ui,sans-serif;';
        d.innerHTML =
          '<style>@keyframes updspin{to{transform:rotate(360deg)}}</style>' +
          '<div style="width:30px;height:30px;border:3px solid #e8eaed;border-top-color:#1a73e8;border-radius:50%;animation:updspin .8s linear infinite"></div>' +
          '<div style="margin-top:20px;color:#202124;font-size:15px">アップデート中…</div>' +
          '<div style="margin-top:6px;color:#5f6368;font-size:12px">最新バージョンに更新しています</div>';
        document.body.appendChild(d);
      } catch (_) {}
      try {
        if (navigator.serviceWorker) {
          var regs = await navigator.serviceWorker.getRegistrations();
          for (var i = 0; i < regs.length; i++) {
            try { await regs[i].unregister(); } catch (_) {}
          }
        }
      } catch (_) {}
      try {
        if (window.caches) {
          var keys = await caches.keys();
          for (var j = 0; j < keys.length; j++) {
            try { await caches.delete(keys[j]); } catch (_) {}
          }
        }
      } catch (_) {}
      setTimeout(function () { location.reload(); }, 400);
    };

    // Fake-but-honest progress: advances while scripts download, jumps to 100 on first frame.
    (function () {
      var pct = 0;
      var bar = document.getElementById('bootbar');
      var label = document.getElementById('bootpct');
      var timer = setInterval(function () {
        // ease towards 90% while loading
        pct += Math.max(0.4, (90 - pct) * 0.045);
        if (pct > 90) pct = 90;
        bar.style.width = pct + '%';
        label.textContent = Math.round(pct) + '%';
      }, 200);

      window.addEventListener('flutter-first-frame', function () {
        clearInterval(timer);
        bar.style.width = '100%';
        label.textContent = '100%';
        var boot = document.getElementById('boot');
        setTimeout(function () { boot.classList.add('hide'); }, 150);
        setTimeout(function () { boot.remove(); }, 700);
      });
    })();
  </script>
  <!-- build id baked at deploy time (same-cache as this HTML) -->
  <script src="build_id.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
